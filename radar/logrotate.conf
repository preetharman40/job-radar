# Rotation for the radar's logs. Run from the user's cron, not
# /etc/logrotate.d, so it needs no root and lives with the code it rotates.
#
# This replaces `find radar -name '*.log' -size +5M -delete`, which did not
# rotate anything - it DELETED the log once it passed 5MB. Nothing had tripped
# it yet, but it was certain to: verify.log grows 21K/day and would have hit
# the limit in about 204 days, radar.log in 362, and at that moment every
# record of what the radar had done would be gone. A log you delete is a log
# you cannot analyse, which is the opposite of why it is kept.
#
# 12 weekly generations, compressed, is about three months of history for a
# fraction of the current size.

/home/harman/devops/jobs/radar/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty

    # copytruncate for every log, including the cron ones that would not
    # strictly need it, because serve.py runs under systemd with
    # StandardOutput=append: and holds web.log's descriptor open for the life
    # of the process. Renaming that file would leave the app writing to an
    # inode nothing can find and the log would appear to simply stop - the
    # exact silent failure this whole exercise is about. A separate stanza for
    # it is not possible: *.log already matches it and logrotate rejects a
    # duplicate entry.
    #
    # The tradeoff is a microsecond window between copy and truncate in which
    # a write can be lost. On logs written a few times an hour that is an
    # acceptable price for never losing the file itself.
    copytruncate

    # Dates in the filename rather than .1/.2/.3 - reconstructing an incident
    # means opening the week it happened, not counting backwards through
    # generations.
    dateext
    dateformat -%Y-%m-%d
}

# events.jsonl is the machine-readable run history and does not match *.log, so
# it needs its own stanza. Monthly rather than weekly, and 12 generations, so a
# year of history stays queryable: at roughly 200 bytes a run and ~160 runs a
# day this is about 12MB a year, which is cheap for the only record that can
# answer "what did this lane do on the 14th". logq.py reads the rotated and
# compressed generations too, so rotating does not shorten what you can ask
# about.
/home/harman/devops/jobs/radar/events.jsonl {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y-%m-%d
}
